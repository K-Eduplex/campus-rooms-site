<!doctype html>
<html lang="en" data-theme="keduplex">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Rooms</title>
  <!--
    [index.html] — 단일 페이지 골격. 로직은 전부 js/ 에 있다.
    로드 순서가 중요하다: config → time → i18n 사전 → i18n → ui → mock → api → auth → 화면 모듈 → app.
    화면 언어는 영어만(D-12). 주석·문서는 한국어.
    ?mock=1 을 붙이면 백엔드 없이 동작한다.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css?v=55513dc">
  <link rel="stylesheet" href="css/app.css?v=55513dc">
</head>
<body>
  <div id="progress" class="progress" hidden><div class="progress-bar"></div></div>
  <div id="mock-banner" class="banner" hidden data-i18n="mockBanner"></div>

  <header class="header">
    <div class="brand"><img class="logo" src="img/logo.png" alt="K-eduplex" onerror="this.hidden=true"><div><h1 data-i18n="app.title"></h1><span class="tz" data-i18n="app.tz"></span></div></div>
    <div class="header-right">
      <a class="btn btn-sm" href="help.html" data-i18n="nav.help"></a>
      <span id="user-name" class="muted"></span>
      <button id="signout" class="btn btn-sm" type="button" data-i18n="login.signout"></button>
    </div>
  </header>

  <!-- 로그인 전 -->
  <section id="login" class="login">
    <div id="login-form">
      <h2 data-i18n="login.title"></h2>
      <p class="muted" data-i18n="login.desc"></p>
      <div id="login-button"></div>
    </div>
    <!-- 로그인 버튼을 누른 뒤 인증·세션 교환·첫 데이터까지 몇 초 걸리는 동안 보여주는 상태 -->
    <div id="signing-in" hidden>
      <div class="spinner"></div>
      <p id="signing-in-text" class="muted" data-i18n="login.signingIn"></p>
    </div>
  </section>

  <!-- 로그인 후 -->
  <main id="app" hidden>
    <nav class="tabs">
      <button id="tab-board" class="tab active" type="button" data-i18n="nav.board"></button>
      <button id="tab-mine" class="tab" type="button"><span data-i18n="nav.mine"></span><span id="mine-badge" class="tab-badge" hidden></span></button>
      <button id="tab-approvals" class="tab" type="button" hidden><span data-i18n="nav.approvals"></span><span id="approvals-badge" class="tab-badge" hidden></span></button>
      <button id="tab-status" class="tab" type="button" hidden data-i18n="nav.status"></button>
      <button id="tab-settings" class="tab" type="button" data-i18n="nav.settings" hidden></button>
    </nav>
    <section id="view-board" class="view"></section>
    <section id="view-mine" class="view" hidden></section>
    <section id="view-approvals" class="view" hidden></section>
    <section id="view-status" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>

  <footer class="footer"><a href="help.html">User guide</a> · <a href="privacy.html">Privacy Policy</a> · <a href="mailto:its@k-eduplex.net">Contact</a></footer>

  <div id="toasts" role="status" aria-live="polite"></div>

  <script src="js/config.js?v=55513dc"></script>
  <script src="js/time.js?v=55513dc"></script>
  <script src="js/recurrence.js?v=55513dc"></script>
  <script src="i18n/en.js?v=55513dc"></script>
  <script src="js/i18n.js?v=55513dc"></script>
  <script src="js/ui.js?v=55513dc"></script>
  <script src="js/mock.js?v=55513dc"></script>
  <script src="js/api.js?v=55513dc"></script>
  <script src="js/auth.js?v=55513dc"></script>
  <script src="js/people.js?v=55513dc"></script>
  <script src="js/board.js?v=55513dc"></script>
  <script src="js/bookingForm.js?v=55513dc"></script>
  <script src="js/myBookings.js?v=55513dc"></script>
  <script src="js/approvals.js?v=55513dc"></script>
  <script src="js/status.js?v=55513dc"></script>
  <script src="js/settings.js?v=55513dc"></script>
  <script src="js/app.js?v=55513dc"></script>
</body>
</html>
